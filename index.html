<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khai Portal - Hệ Thống Ứng Dụng Dạy Học & Học Liệu Số</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0d1117;
      --sidebar-bg: #161b22;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --active-bg: #21262d;
      --accent-color: #2f81f7;
      --tag-green: #238636;
      --tag-blue: #1f6feb;
      --tag-purple: #8957e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

    /* SIDEBAR */
    aside { width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
    .brand { padding: 18px 20px; font-size: 1.15rem; font-weight: 600; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-color); color: #58a6ff; }
    .menu-group { flex: 1; padding: 12px 8px; overflow-y: auto; }
    .menu-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); padding: 12px 12px 6px; font-weight: 600; }
    .nav-btn {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 4px;
      border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text-secondary);
      cursor: pointer; font-size: 0.95rem; text-align: left; transition: all 0.2s;
    }
    .nav-btn:hover { background-color: var(--active-bg); color: var(--text-primary); }
    .nav-btn.active { background-color: var(--active-bg); border-color: var(--border-color); color: #fff; font-weight: 600; }
    .nav-btn i { font-size: 1.1rem; width: 20px; text-align: center; }

    /* MAIN CONTAINER */
    main { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: #010409; position: relative; }
    .topbar {
      height: 54px; border-bottom: 1px solid var(--border-color); background-color: var(--sidebar-bg);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    }
    .topbar-title { display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: 600; }
    .topbar-actions { display: flex; gap: 8px; }
    .btn-action {
      background-color: var(--active-bg); border: 1px solid var(--border-color); color: var(--text-primary);
      padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none;
    }
    .btn-action:hover { background-color: #30363d; }

    /* HUB DASHBOARD VIEW */
    #dashboard-view { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    
    /* Bộ lọc và Tìm kiếm */
    .filter-bar {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px 18px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    }
    .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab-btn {
      background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary);
      padding: 6px 14px; border-radius: 20px; font-size: 0.88rem; cursor: pointer; transition: 0.2s;
    }
    .tab-btn.active, .tab-btn:hover { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
    .search-box { position: relative; min-width: 260px; }
    .search-box input {
      width: 100%; background: #0d1117; border: 1px solid var(--border-color); color: #fff;
      padding: 8px 12px 8px 36px; border-radius: 6px; font-size: 0.9rem; outline: none;
    }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

    /* Lưới hiển thị tài nguyên */
    .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .res-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px;
      padding: 18px; display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .res-card:hover { transform: translateY(-3px); border-color: #58a6ff; }
    .res-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .badge-type { font-size: 0.72rem; font-weight: bold; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
    .badge-giaoan { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #238636; }
    .badge-dethi { background: rgba(210, 153, 34, 0.2); color: #d29922; border: 1px solid #9e6a03; }
    .badge-ppt { background: rgba(247, 120, 186, 0.2); color: #f778ba; border: 1px solid #bf4b8a; }
    .res-meta { font-size: 0.8rem; color: var(--text-secondary); }
    .res-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 8px; line-height: 1.4; color: #f0f6fc; }
    .res-desc { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.4; flex-grow: 1; }
    .res-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; }
    .res-tag { font-size: 0.75rem; color: #58a6ff; }
    .btn-download {
      background: #21262d; border: 1px solid var(--border-color); color: #fff; padding: 6px 12px;
      border-radius: 6px; font-size: 0.82rem; text-decoration: none; display: flex; align-items: center; gap: 6px;
    }
    .btn-download:hover { background: #30363d; border-color: #8b949e; }

    /* VIEWPORT HIỂN THỊ CÁC ỨNG DỤNG CON (IFRAME) */
    #app-viewport-container { display: none; width: 100%; height: calc(100vh - 54px); position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .loader {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: none; flex-direction: column; align-items: center; gap: 12px; color: var(--text-secondary);
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border-color); border-top-color: var(--accent-color);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- SIDEBAR BÊN TRÁI -->
  <aside>
    <div class="brand">
      <i class="fa-solid fa-layer-group"></i>
      <span>Khai System</span>
    </div>
    <div class="menu-group">
      <!-- Mục Trang chủ Cổng học liệu -->
      <div class="menu-label">Cổng Tài Nguyên</div>
      <button class="nav-btn active" id="btn-home">
        <i class="fa-solid fa-house" style="color: #58a6ff;"></i>
        <span>Trang Chủ Học Liệu</span>
      </button>

      <!-- Danh sách ứng dụng nạp từ APPS_CONFIG -->
      <div id="dynamic-apps-menu"></div>
    </div>
  </aside>

  <!-- NỘI DUNG CHÍNH -->
  <main>
    <div class="topbar">
      <div class="topbar-title">
        <i id="header-icon" class="fa-solid fa-house" style="color: #58a6ff;"></i>
        <span id="header-title">Kho Học Liệu & Công Cụ Sư Phạm</span>
      </div>
      <div class="topbar-actions">
        <a id="btn-external" href="#" target="_blank" class="btn-action" style="display: none;">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> Tab mới
        </a>
        <button id="btn-fullscreen" class="btn-action">
          <i class="fa-solid fa-expand"></i> Phóng to
        </button>
      </div>
    </div>

    <!-- KHU VỰC 1: TRANG CHỦ HỌC LIỆU -->
    <div id="dashboard-view">
      <div class="filter-bar">
        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">Tất cả</button>
          <button class="tab-btn" data-filter="giaoan"><i class="fa-solid fa-file-word"></i> Giáo án / KHBD</button>
          <button class="tab-btn" data-filter="dethi"><i class="fa-solid fa-clipboard-question"></i> Đề thi & Ma trận</button>
          <button class="tab-btn" data-filter="ppt"><i class="fa-solid fa-file-powerpoint"></i> Bài giảng PPT</button>
        </div>
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Tìm tên bài, môn, lớp 10, 11...">
        </div>
      </div>

      <!-- Danh sách thẻ bài học tự động tạo -->
      <div class="resource-grid" id="resourceList"></div>
    </div>

    <!-- KHU VỰC 2: KHUNG CHẠY APP CON (IFRAME) -->
    <div id="app-viewport-container">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <span>Đang nạp ứng dụng...</span>
      </div>
      <iframe id="app-frame" src="" allow="camera; microphone; autoplay; fullscreen"></iframe>
    </div>
  </main>

  <!-- Nạp file dữ liệu tách rời -->
  <script src="data.js"></script>

  <script>
    const dashboardView = document.getElementById('dashboard-view');
    const appViewportContainer = document.getElementById('app-viewport-container');
    const appFrame = document.getElementById('app-frame');
    const loader = document.getElementById('loader');
    const headerTitle = document.getElementById('header-title');
    const headerIcon = document.getElementById('header-icon');
    const btnExternal = document.getElementById('btn-external');
    const btnHome = document.getElementById('btn-home');
    const dynamicAppsMenu = document.getElementById('dynamic-apps-menu');
    const resourceList = document.getElementById('resourceList');
    const searchInput = document.getElementById('searchInput');
    const filterTabs = document.querySelectorAll('.tab-btn');

    let currentFilter = 'all';

    // 1. KHỞI TẠO MENU TỪ APPS_CONFIG
    function initSidebar() {
      if (typeof APPS_CONFIG === 'undefined') return;
      dynamicAppsMenu.innerHTML = '';

      APPS_CONFIG.forEach(group => {
        if (group.category) {
          const label = document.createElement('div');
          label.className = 'menu-label';
          label.textContent = group.category;
          dynamicAppsMenu.appendChild(label);
        }
        group.items.forEach(item => {
          const btn = document.createElement('button');
          btn.className = 'nav-btn';
          btn.innerHTML = `<i class="${item.icon}" style="color: ${item.color};"></i><span>${item.name}</span>`;
          btn.addEventListener('click', () => openApp(item, btn));
          dynamicAppsMenu.appendChild(btn);
        });
      });
    }

    // 2. CHUYỂN ĐỔI GIỮA TRANG CHỦ VÀ CÁC APP CON
    btnHome.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btnHome.classList.add('active');
      dashboardView.style.display = 'flex';
      appViewportContainer.style.display = 'none';
      btnExternal.style.display = 'none';
      headerTitle.textContent = 'Kho Học Liệu & Công Cụ Sư Phạm';
      headerIcon.className = 'fa-solid fa-house';
      headerIcon.style.color = '#58a6ff';
    });

    function openApp(item, activeBtn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      activeBtn.classList.add('active');
      dashboardView.style.display = 'none';
      appViewportContainer.style.display = 'block';
      btnExternal.style.display = 'flex';
      btnExternal.href = item.url;
      headerTitle.textContent = item.name;
      headerIcon.className = item.icon;
      headerIcon.style.color = item.color;

      loader.style.display = 'flex';
      appFrame.style.opacity = '0';
      appFrame.src = item.url;
    }

    appFrame.addEventListener('load', () => {
      loader.style.display = 'none';
      appFrame.style.opacity = '1';
    });

    // 3. HIỂN THỊ KHO TÀI LIỆU TỪ RESOURCES_DATA
    function renderResources() {
      if (typeof RESOURCES_DATA === 'undefined') return;
      const keyword = searchInput.value.toLowerCase().trim();
      resourceList.innerHTML = '';

      const filtered = RESOURCES_DATA.filter(res => {
        const matchFilter = (currentFilter === 'all') || (res.type === currentFilter);
        const matchKeyword = res.title.toLowerCase().includes(keyword) ||
                             res.subject.toLowerCase().includes(keyword) ||
                             res.grade.includes(keyword) ||
                             (res.description && res.description.toLowerCase().includes(keyword));
        return matchFilter && matchKeyword;
      });

      if (filtered.length === 0) {
        resourceList.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px 0;">Không tìm thấy tài liệu phù hợp.</div>`;
        return;
      }

      filtered.forEach(res => {
        let typeBadge = '';
        if (res.type === 'giaoan') typeBadge = '<span class="badge-type badge-giaoan">KHBD 5512</span>';
        else if (res.type === 'dethi') typeBadge = '<span class="badge-type badge-dethi">Đề kiểm tra</span>';
        else if (res.type === 'ppt') typeBadge = '<span class="badge-type badge-ppt">Bài giảng PPT</span>';

        const card = document.createElement('div');
        card.className = 'res-card';
        card.innerHTML = `
          <div>
            <div class="res-header">
              ${typeBadge}
              <span class="res-meta">${res.subject} • Khối ${res.grade}</span>
            </div>
            <div class="res-title">${res.title}</div>
            <div class="res-desc">${res.description || ''}</div>
          </div>
          <div class="res-footer">
            <span class="res-tag"><i class="fa-solid fa-clock-rotate-left"></i> ${res.updatedDate || ''}</span>
            <a href="${res.downloadUrl}" target="_blank" class="btn-download">
              <i class="fa-solid fa-download"></i> Tải về
            </a>
          </div>
        `;
        resourceList.appendChild(card);
      });
    }

    // 4. LẮNG NGHE BỘ LỌC VÀ TÌM KIẾM
    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.getAttribute('data-filter');
        renderResources();
      });
    });

    searchInput.addEventListener('input', renderResources);

    // 5. NÚT TOÀN MÀN HÌNH
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    // CHẠY KHỞI TẠO
    initSidebar();
    renderResources();
  </script>
</body>
</html>
