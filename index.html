<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khai Portal - Hệ Thống Quản Lý Học Liệu & Dạy Học</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-dark: #090d16;
      --sidebar-bg: #111726;
      --card-bg: #161f36;
      --border-color: #233054;
      --text-main: #f0f6fc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* --- SIDEBAR --- */
    aside {
      width: 250px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; flex-shrink: 0; z-index: 10;
    }
    .brand {
      padding: 18px 20px; font-size: 1.15rem; font-weight: 700; display: flex; align-items: center;
      gap: 12px; border-bottom: 1px solid var(--border-color); color: #38bdf8;
    }
    .menu-group { flex: 1; padding: 12px 8px; overflow-y: auto; }
    .menu-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-sub); padding: 12px 12px 6px; font-weight: 700; }
    .nav-btn {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 6px;
      border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text-sub);
      cursor: pointer; font-size: 0.92rem; text-align: left; transition: all 0.2s;
    }
    .nav-btn:hover { background-color: #1e293b; color: #fff; }
    .nav-btn.active { background-color: #1e293b; border-color: var(--border-color); color: #38bdf8; font-weight: 600; }
    .nav-btn i { font-size: 1.1rem; width: 22px; text-align: center; }

    /* --- NÚT BẤM HIỆU ỨNG 3D --- */
    .btn-3d {
      border: none; outline: none; border-radius: 8px; font-weight: 600; font-size: 0.88rem;
      padding: 10px 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; transition: all 0.1s ease; text-decoration: none; color: #fff;
    }
    .btn-3d:active { transform: translateY(3px); }

    .btn-3d-green {
      background: #10b981;
      box-shadow: 0 4px 0 #047857, 0 6px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-3d-green:active { box-shadow: 0 1px 0 #047857; }

    .btn-3d-blue {
      background: #0284c7;
      box-shadow: 0 4px 0 #0369a1, 0 6px 12px rgba(2, 132, 199, 0.3);
    }
    .btn-3d-blue:active { box-shadow: 0 1px 0 #0369a1; }

    .btn-3d-orange {
      background: #f59e0b;
      box-shadow: 0 4px 0 #b45309, 0 6px 12px rgba(245, 158, 11, 0.3);
    }
    .btn-3d-orange:active { box-shadow: 0 1px 0 #b45309; }

    .btn-3d-purple {
      background: #8b5cf6;
      box-shadow: 0 4px 0 #6d28d9, 0 6px 12px rgba(139, 92, 246, 0.3);
    }
    .btn-3d-purple:active { box-shadow: 0 1px 0 #6d28d9; }

    .btn-3d-red {
      background: #ef4444;
      box-shadow: 0 3px 0 #b91c1c;
      padding: 6px 10px; font-size: 0.78rem; border-radius: 6px;
    }
    .btn-3d-red:active { box-shadow: 0 1px 0 #b91c1c; transform: translateY(2px); }

    /* --- MAIN VIEWPORT --- */
    main { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
    .topbar {
      height: 60px; border-bottom: 1px solid var(--border-color); background-color: var(--sidebar-bg);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .topbar-title { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; font-weight: 700; color: #fff; }
    .topbar-actions { display: flex; gap: 10px; }

    /* KHU VỰC QUẢN TRỊ TÀI NGUYÊN */
    #dashboard-view { flex: 1; padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }

    /* BẢNG ĐIỀU KHIỂN & BỘ NÚT BẤM 3D */
    .control-panel {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .action-button-group { display: flex; gap: 10px; flex-wrap: wrap; }

    /* THANH LỌC & TÌM KIẾM */
    .filter-wrapper {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    }
    .tab-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-pill {
      background: #111726; border: 1px solid var(--border-color); color: var(--text-sub);
      padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.2s;
    }
    .tab-pill.active, .tab-pill:hover { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: 600; }
    .search-input {
      background: #111726; border: 1px solid var(--border-color); border-radius: 8px; color: #fff;
      padding: 8px 14px 8px 36px; font-size: 0.9rem; outline: none; width: 260px;
    }
    .search-container { position: relative; }
    .search-container i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

    /* DANH SÁCH THẺ HỌC LIỆU */
    .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card-res {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 18px; display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s; position: relative;
    }
    .card-res:hover { transform: translateY(-4px); border-color: #38bdf8; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .card-res-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .badge-kind { font-size: 0.72rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
    .badge-giaoan { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; }
    .badge-dethi { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #d97706; }
    .badge-ppt { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid #7c3aed; }
    
    .card-res-title { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.4; }
    .card-res-desc { font-size: 0.85rem; color: var(--text-sub); line-height: 1.4; margin-bottom: 16px; flex-grow: 1; }
    .card-res-meta { display: flex; gap: 8px; font-size: 0.78rem; color: #38bdf8; margin-bottom: 12px; flex-wrap: wrap; }
    .card-res-meta span { background: #111726; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border-color); }
    .card-res-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; }

    /* MODAL FORM TẠO BÀI MỚI / SAO LƯU */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-content {
      background: #111726; border: 1px solid #38bdf8; border-radius: 14px; width: 90%; max-width: 580px;
      padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto;
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; color: #38bdf8; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: #090d16; border: 1px solid var(--border-color); border-radius: 6px;
      padding: 8px 12px; color: #fff; font-size: 0.9rem; outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #38bdf8; }

    /* KHUNG IFRAME ỨNG DỤNG CON */
    #app-container { display: none; width: 100%; height: calc(100vh - 60px); position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
  </style>
</head>
<body>

  <!-- THANH SIDEBAR -->
  <aside>
    <div class="brand">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>KHAI PORTAL</span>
    </div>
    <div class="menu-group">
      <div class="menu-label">Cổng Học Liệu</div>
      <button class="nav-btn active" id="btn-portal-home">
        <i class="fa-solid fa-folder-open" style="color: #38bdf8;"></i>
        <span>Kho Học Liệu GDPT</span>
      </button>

      <div class="menu-label">Ứng Dụng Giảng Dạy</div>
      <button class="nav-btn" data-url="/biomaster-ai/" data-title="BioMaster AI" data-color="#34d399">
        <i class="fa-solid fa-dna" style="color: #34d399;"></i>
        <span>BioMaster AI</span>
      </button>
      <button class="nav-btn" data-url="/trochoi/" data-title="Trò Chơi Học Tập" data-color="#fbbf24">
        <i class="fa-solid fa-gamepad" style="color: #fbbf24;"></i>
        <span>Trò Chơi Học Tập</span>
      </button>
    </div>
  </aside>

  <!-- KHU VỰC CHÍNH -->
  <main>
    <div class="topbar">
      <div class="topbar-title">
        <i id="top-icon" class="fa-solid fa-folder-open" style="color: #38bdf8;"></i>
        <span id="top-title">Kho Tài Nguyên Giáo Án, Đề Thi & PPT</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-fullscreen" class="btn-3d btn-3d-blue" style="padding: 6px 12px; font-size: 0.8rem;">
          <i class="fa-solid fa-expand"></i> Phóng to
        </button>
      </div>
    </div>

    <!-- KHU VỰC DASHBOARD QUẢN LÝ BÀI -->
    <div id="dashboard-view">
      
      <!-- KHUNG ĐIỀU KHIỂN & BỘ NÚT 3D -->
      <div class="control-panel">
        <div class="action-button-group">
          <!-- Nút tạo mới 3D -->
          <button class="btn-3d btn-3d-green" id="btn-open-create">
            <i class="fa-solid fa-circle-plus"></i> Đưa Lên / Tạo Mới
          </button>
          <!-- Nút sao lưu Key 3D -->
          <button class="btn-3d btn-3d-orange" id="btn-open-backup">
            <i class="fa-solid fa-cloud-arrow-up"></i> Key Sao Lưu Đa Máy
          </button>
          <!-- Nút tải file dự phòng -->
          <button class="btn-3d btn-3d-purple" id="btn-export-file">
            <i class="fa-solid fa-file-export"></i> Xuất File Dự Phòng (.json)
          </button>
        </div>

        <div class="search-container">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Tìm môn, khối, tên bài...">
        </div>
      </div>

      <!-- BỘ LỌC THẺ -->
      <div class="filter-wrapper">
        <div class="tab-pills">
          <button class="tab-pill active" data-filter="all">Tất cả bài</button>
          <button class="tab-pill" data-filter="giaoan"><i class="fa-solid fa-file-word"></i> Giáo án / KHBD</button>
          <button class="tab-pill" data-filter="dethi"><i class="fa-solid fa-file-circle-question"></i> Ngân hàng Đề</button>
          <button class="tab-pill" data-filter="ppt"><i class="fa-solid fa-file-powerpoint"></i> Slide Bài giảng</button>
        </div>
      </div>

      <!-- DANH SÁCH THẺ HIỂN THỊ TỰ ĐỘNG -->
      <div class="resource-grid" id="resourceContainer"></div>
    </div>

    <!-- KHUNG CHẠY APP CON (IFRAME) -->
    <div id="app-container">
      <iframe id="app-frame" src="" allow="camera; microphone; autoplay; fullscreen"></iframe>
    </div>
  </main>

  <!-- MODAL 1: TẠO MỚI / THÊM BÀI HỌC -->
  <div class="modal-overlay" id="createModal">
    <div class="modal-content">
      <div class="modal-title"><i class="fa-solid fa-plus-circle"></i> Nhập Thông Tin Bài Mới</div>
      <form id="resourceForm">
        <div class="form-row">
          <div class="form-group">
            <label>Phân loại học liệu:</label>
            <select class="form-select" id="inpType" required>
              <option value="giaoan">Giáo án / KHBD (Word)</option>
              <option value="dethi">Đề thi / Kiểm tra</option>
              <option value="ppt">Slide PowerPoint</option>
            </select>
          </div>
          <div class="form-group">
            <label>Khối lớp:</label>
            <select class="form-select" id="inpGrade" required>
              <option value="10">Khối 10</option>
              <option value="11">Khối 11</option>
              <option value="12">Khối 12</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Môn học:</label>
            <select class="form-select" id="inpSubject" required>
              <option value="Sinh học">Sinh học</option>
              <option value="Công nghệ">Công nghệ</option>
              <option value="Vật lý">Vật lý</option>
              <option value="Hóa học">Hóa học</option>
              <option value="Toán học">Toán học</option>
              <option value="Khác">Khác</option>
            </select>
          </div>
          <div class="form-group">
            <label>Bộ sách:</label>
            <input type="text" class="form-input" id="inpBook" value="Kết nối tri thức" required>
          </div>
        </div>

        <div class="form-group">
          <label>Tên bài dạy / Đề kiểm tra:</label>
          <input type="text" class="form-input" id="inpTitle" placeholder="VD: Bài 13: Chuyển hóa vật chất và năng lượng..." required>
        </div>

        <div class="form-group">
          <label>Link Google Drive (Xem / Tải):</label>
          <input type="url" class="form-input" id="inpUrl" placeholder="https://drive.google.com/..." required>
        </div>

        <div class="form-group">
          <label>Mô tả ngắn gọn:</label>
          <textarea class="form-textarea" id="inpDesc" rows="2" placeholder="VD: Chuẩn CV 5512, tích hợp năng lực số và trò chơi trắc nghiệm..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px;">
          <button type="button" class="btn-3d" style="background: #334155; box-shadow: 0 4px 0 #1e293b;" onclick="closeModal('createModal')">Hủy</button>
          <button type="submit" class="btn-3d btn-3d-green"><i class="fa-solid fa-floppy-disk"></i> Lưu Lại Ngay</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: SAO LƯU BẰNG KEY ĐA MÁY -->
  <div class="modal-overlay" id="backupModal">
    <div class="modal-content">
      <div class="modal-title"><i class="fa-solid fa-key"></i> Key Sao Lưu Dữ Liệu Đa Máy</div>
      <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 12px;">
        Sao chép mã Key bên dưới để chuyển sang máy tính khác, hoặc dán mã Key từ máy khác vào đây để đồng bộ dữ liệu mà không sợ mất bài.
      </p>
      <div class="form-group">
        <label>Mã Khóa Dữ Liệu (Backup Key):</label>
        <textarea class="form-textarea" id="backupKeyArea" rows="6" placeholder="Dán mã key dữ liệu vào đây để khôi phục..."></textarea>
      </div>
      <div style="display: flex; justify-content: space-between; gap: 8px; margin-top: 14px;">
        <button class="btn-3d btn-3d-blue" onclick="copyBackupKey()"><i class="fa-solid fa-copy"></i> Sao Chép Key</button>
        <div style="display: flex; gap: 8px;">
          <button class="btn-3d" style="background: #334155; box-shadow: 0 4px 0 #1e293b;" onclick="closeModal('backupModal')">Đóng</button>
          <button class="btn-3d btn-3d-orange" onclick="restoreFromKey()"><i class="fa-solid fa-rotate"></i> Khôi Phục Dữ Liệu</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DỮ LIỆU BAN ĐẦU NẾU TRÌNH DUYỆT CHƯA CÓ LƯU TRỮ
    const DEFAULT_RESOURCES = [
      {
        id: "res_1",
        type: "giaoan",
        grade: "11",
        subject: "Sinh học",
        book: "Kết nối tri thức",
        title: "KHBD Bài 13: Khái quát về chuyển hóa vật chất và năng lượng",
        url: "https://drive.google.com/",
        desc: "Chuẩn Công văn 5512, tích hợp năng lực số và ứng dụng AI.",
        date: "25/10/2026"
      },
      {
        id: "res_2",
        type: "dethi",
        grade: "11",
        subject: "Sinh học",
        book: "Kết nối tri thức",
        title: "Đề ôn tập Giữa kỳ 1 - Cấu trúc 3 phần trắc nghiệm mới",
        url: "https://drive.google.com/",
        desc: "Gồm Trắc nghiệm 4 lựa chọn, Đúng/Sai gạch chân và Trả lời ngắn.",
        date: "25/10/2026"
      }
    ];

    // LẤY DỮ LIỆU TỪ BỘ NHỚ LOCALSTORAGE
    function getStoredData() {
      const data = localStorage.getItem('KHAI_RESOURCES_DATA');
      return data ? JSON.parse(data) : DEFAULT_RESOURCES;
    }

    // LƯU DỮ LIỆU VÀO LOCALSTORAGE
    function saveStoredData(data) {
      localStorage.setItem('KHAI_RESOURCES_DATA', JSON.stringify(data));
      renderResourceCards();
    }

    let currentFilter = 'all';
    const resourceContainer = document.getElementById('resourceContainer');
    const searchInput = document.getElementById('searchInput');

    // HIỂN THỊ DANH SÁCH THẺ BÀI HỌC
    function renderResourceCards() {
      const list = getStoredData();
      const keyword = searchInput.value.toLowerCase().trim();
      resourceContainer.innerHTML = '';

      const filtered = list.filter(item => {
        const matchFilter = (currentFilter === 'all') || (item.type === currentFilter);
        const matchKeyword = item.title.toLowerCase().includes(keyword) ||
                             item.subject.toLowerCase().includes(keyword) ||
                             item.grade.includes(keyword) ||
                             (item.desc && item.desc.toLowerCase().includes(keyword));
        return matchFilter && matchKeyword;
      });

      if (filtered.length === 0) {
        resourceContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 40px 0;">Không tìm thấy bài học nào phù hợp. Bấm "Tạo Mới" để thêm!</div>`;
        return;
      }

      filtered.forEach(item => {
        let badgeHtml = '';
        if (item.type === 'giaoan') badgeHtml = '<span class="badge-kind badge-giaoan">Giáo Án 5512</span>';
        else if (item.type === 'dethi') badgeHtml = '<span class="badge-kind badge-dethi">Đề Kiểm Tra</span>';
        else if (item.type === 'ppt') badgeHtml = '<span class="badge-kind badge-ppt">Slide PPT</span>';

        const card = document.createElement('div');
        card.className = 'card-res';
        card.innerHTML = `
          <div>
            <div class="card-res-top">
              ${badgeHtml}
              <button class="btn-3d btn-3d-red" onclick="deleteResource('${item.id}')" title="Xóa bài này">
                <i class="fa-solid fa-trash-can"></i> Xóa
              </button>
            </div>
            <div class="card-res-meta">
              <span>Môn: ${item.subject}</span>
              <span>Lớp ${item.grade}</span>
              <span>${item.book}</span>
            </div>
            <div class="card-res-title">${item.title}</div>
            <div class="card-res-desc">${item.desc || 'Chưa có mô tả chi tiết.'}</div>
          </div>
          <div class="card-res-foot">
            <span style="font-size: 0.75rem; color: var(--text-sub);"><i class="fa-regular fa-clock"></i> ${item.date}</span>
            <a href="${item.url}" target="_blank" class="btn-3d btn-3d-blue" style="padding: 6px 12px; font-size: 0.8rem;">
              <i class="fa-brands fa-google-drive"></i> Mở Drive
            </a>
          </div>
        `;
        resourceContainer.appendChild(card);
      });
    }

    // XỬ LÝ FORM THÊM MỚI BÀI HỌC
    document.getElementById('resourceForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const list = getStoredData();

      const newResource = {
        id: 'res_' + Date.now(),
        type: document.getElementById('inpType').value,
        grade: document.getElementById('inpGrade').value,
        subject: document.getElementById('inpSubject').value,
        book: document.getElementById('inpBook').value,
        title: document.getElementById('inpTitle').value,
        url: document.getElementById('inpUrl').value,
        desc: document.getElementById('inpDesc').value,
        date: new Date().toLocaleDateString('vi-VN')
      };

      list.unshift(newResource);
      saveStoredData(list);
      this.reset();
      closeModal('createModal');
      alert('Đã lưu bài học thành công lên cổng học liệu!');
    });

    // XÓA BÀI HỌC
    function deleteResource(id) {
      if (confirm('Bạn có chắc chắn muốn xóa bài này khỏi danh sách không?')) {
        let list = getStoredData();
        list = list.filter(item => item.id !== id);
        saveStoredData(list);
      }
    }

    // SAO LƯU & KHÔI PHỤC BẰNG MÃ KEY
    function copyBackupKey() {
      const area = document.getElementById('backupKeyArea');
      area.select();
      navigator.clipboard.writeText(area.value);
      alert('Đã sao chép mã Key sao lưu vào bộ nhớ tạm! Bạn có thể dán sang máy khác.');
    }

    function restoreFromKey() {
      const key = document.getElementById('backupKeyArea').value.trim();
      if (!key) return alert('Vui lòng dán mã Key sao lưu vào khung!');
      try {
        const parsed = JSON.parse(decodeURIComponent(escape(atob(key))));
        if (Array.isArray(parsed)) {
          saveStoredData(parsed);
          closeModal('backupModal');
          alert('Đã khôi phục toàn bộ bài học thành công!');
        } else throw new Error();
      } catch (err) {
        alert('Mã Key sao lưu không hợp lệ hoặc bị lỗi định dạng!');
      }
    }

    // XUẤT FILE JSON DỰ PHÒNG TẢI VỀ MÁY
    document.getElementById('btn-export-file').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getStoredData(), null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `SaoLuu_HocLieu_${new Date().toLocaleDateString('vi-VN').replace(/\//g, '-')}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // BỘ LỌC TABS & TÌM KIẾM
    document.querySelectorAll('.tab-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.tab-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.getAttribute('data-filter');
        renderResourceCards();
      });
    });
    searchInput.addEventListener('input', renderResourceCards);

    // BẬT / TẮT MODAL
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    document.getElementById('btn-open-create').addEventListener('click', () => openModal('createModal'));
    document.getElementById('btn-open-backup').addEventListener('click', () => {
      const key = btoa(unescape(encodeURIComponent(JSON.stringify(getStoredData()))));
      document.getElementById('backupKeyArea').value = key;
      openModal('backupModal');
    });

    // ĐIỀU HƯỚNG GIỮA TRANG CHỦ & CÁC APP CON (IFRAME)
    const btnPortalHome = document.getElementById('btn-portal-home');
    const dashboardView = document.getElementById('dashboard-view');
    const appContainer = document.getElementById('app-container');
    const appFrame = document.getElementById('app-frame');
    const topTitle = document.getElementById('top-title');
    const topIcon = document.getElementById('top-icon');

    btnPortalHome.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btnPortalHome.classList.add('active');
      dashboardView.style.display = 'flex';
      appContainer.style.display = 'none';
      topTitle.textContent = 'Kho Tài Nguyên Giáo Án, Đề Thi & PPT';
      topIcon.className = 'fa-solid fa-folder-open';
      topIcon.style.color = '#38bdf8';
    });

    document.querySelectorAll('.nav-btn[data-url]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        dashboardView.style.display = 'none';
        appContainer.style.display = 'block';

        const url = btn.getAttribute('data-url');
        const title = btn.getAttribute('data-title');
        const color = btn.getAttribute('data-color');
        const icon = btn.querySelector('i').className;

        topTitle.textContent = title;
        topIcon.className = icon;
        topIcon.style.color = color;
        appFrame.src = url;
      });
    });

    // CHẾ ĐỘ TOÀN MÀN HÌNH
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    // KHỞI CHẠY LẦN ĐẦU
    renderResourceCards();
  </script>
</body>
</html>
